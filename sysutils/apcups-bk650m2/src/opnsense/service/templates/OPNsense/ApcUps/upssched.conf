CMDSCRIPT /usr/local/opnsense/scripts/apcupsbk650m2/upssched-cmd.sh
PIPEFN /var/run/nut/upssched.pipe
LOCKFN /var/run/nut/upssched.lock

# Power event notifications
AT ONBATT * EXECUTE onbatt_alert
AT ONLINE * EXECUTE online_alert
AT LOWBATT * EXECUTE lowbatt_alert

# Connection event notifications. COMMBAD is debounced: the alert only fires
# if the communication loss persists for the grace period, so a brief drop
# that recovers by itself does not notify.
AT COMMBAD * START-TIMER commbad_alert {{ OPNsense.ApcUps.notifications.commAlertGrace|default("120") }}
AT COMMOK * CANCEL-TIMER commbad_alert
AT COMMOK * EXECUTE commok_alert
AT NOCOMM * EXECUTE nocomm_alert

# Battery level monitoring (for notification threshold and percentage-based shutdown)
AT ONBATT * START-TIMER battery_check 30
AT ONLINE * CANCEL-TIMER battery_check
AT ONLINE * EXECUTE reset_battery_alert

{% if OPNsense.ApcUps.shutdown.mode|default("timer") == "timer" %}
# Timer-based shutdown
AT ONBATT * START-TIMER onbatt_shutdown {{ OPNsense.ApcUps.shutdown.onBatteryDelay|default("300") }}
AT ONLINE * CANCEL-TIMER onbatt_shutdown
AT LOWBATT * EXECUTE lowbatt_shutdown
{% elif OPNsense.ApcUps.shutdown.mode|default("timer") == "lowbatt" %}
# Low-battery shutdown
AT LOWBATT * EXECUTE lowbatt_shutdown
{% elif OPNsense.ApcUps.shutdown.mode|default("timer") == "battery" %}
# Percentage-based shutdown is handled by battery_check.py
{% endif %}
