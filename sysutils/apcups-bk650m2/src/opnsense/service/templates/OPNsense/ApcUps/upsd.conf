{% if helpers.exists('OPNsense.ApcUps.general.serverEnabled') and OPNsense.ApcUps.general.serverEnabled == '1' %}
# UPS Server mode: serve UPS data to LAN clients (NAS / Proxmox / WinNUT
# secondaries). 0.0.0.0 and :: include the loopback addresses, so the local
# driver/upsmon keep working. Restrict access with firewall rules on the
# interfaces that should reach TCP 3493.
LISTEN 0.0.0.0 3493
LISTEN :: 3493
{% else %}
LISTEN 127.0.0.1 3493
LISTEN ::1 3493
{% endif %}
# Allow data to remain valid for up to 60 seconds, giving the 15-second
# pollinterval and 30-second pollfreq enough headroom.
MAXAGE 60
