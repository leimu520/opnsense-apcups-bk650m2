{% if helpers.exists('OPNsense.ApcUps.general.enabled') and OPNsense.ApcUps.general.enabled == '1' %}
[{{ OPNsense.ApcUps.general.upsName|default("BK650M2") }}]
    user = root
    driver = {{ OPNsense.ApcUps.general.driver|default("usbhid-ups") }}
    port = {{ OPNsense.ApcUps.general.port|default("auto") }}
    desc = "{{ OPNsense.ApcUps.general.description|default("APC Back-UPS BK650M2") }}"
    vendorid = {{ OPNsense.ApcUps.general.vendorId|default("051d") }}
    # Polling only avoids interrupt transfer stalls that can cause the APC USB
    # connection to drop after a period of time.
    pollonly
    # Slow down the poll rate to avoid control timeouts on the APC USB HID
    # interface; 15 seconds is a commonly-recommended value for APC units.
    pollinterval = 15
    # Wait before reconnecting after an unexpected USB error, giving the UPS
    # firmware time to recover.
    waitbeforereconnect = 30
    # Retry driver startup a few times before giving up.
    maxretry = 3
    retrydelay = 5
    override.battery.charge.low = {{ OPNsense.ApcUps.shutdown.lowBatteryCharge|default("20") }}
    override.battery.runtime.low = {{ OPNsense.ApcUps.shutdown.lowRuntime|default("180") }}
{% endif %}
