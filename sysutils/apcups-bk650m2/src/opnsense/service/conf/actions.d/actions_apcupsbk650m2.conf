[start]
command:/usr/local/opnsense/scripts/apcupsbk650m2/service.sh start
parameters:
type:script
message:starting APC BK650M2 UPS service

[stop]
command:/usr/local/opnsense/scripts/apcupsbk650m2/service.sh stop
parameters:
type:script
message:stopping APC BK650M2 UPS service

[restart]
command:/usr/local/opnsense/scripts/apcupsbk650m2/service.sh restart
parameters:
type:script
message:restarting APC BK650M2 UPS service

[force-restart]
command:/usr/local/opnsense/scripts/apcupsbk650m2/service.sh force-restart
parameters:
type:script
message:force restarting APC BK650M2 UPS service

[reset-usb]
command:/usr/local/opnsense/scripts/apcupsbk650m2/service.sh reset-usb
parameters:
type:script
message:resetting APC BK650M2 UPS USB device

[status]
command:/usr/local/opnsense/scripts/apcupsbk650m2/status.php
parameters:%s
type:script_output
errors:no
message:retrieve APC BK650M2 UPS status

[diagnostics]
command:/usr/local/opnsense/scripts/apcupsbk650m2/diagnostics.php
parameters:%s
type:script_output
errors:no
message:retrieve APC BK650M2 UPS diagnostics
